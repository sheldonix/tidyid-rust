name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io after all checks pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-24.04
    environment: crates.io
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --features wasm_js
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify release tag
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: cargo package --locked
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: cargo publish --locked --dry-run
      - name: Authenticate with crates.io
        id: crates-io-auth
        if: github.event_name == 'push' || inputs.publish
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
