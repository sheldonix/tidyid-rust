[package]
name = "tidyid"
version = "2.1.1"
edition = "2024"
rust-version = "1.85"
description = "A secure, high-performance, and human-friendly ID generator for Rust."
license = "MIT"
repository = "https://github.com/sheldonix/tidyid-rust"
documentation = "https://docs.rs/tidyid"
readme = "README.md"
keywords = ["id", "generator", "random", "secure", "csprng"]
categories = ["algorithms", "command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
getrandom = "0.3.4"
num-bigint = { version = "0.4.6", optional = true }

[features]
default = []
metrics = ["dep:num-bigint"]
wasm_js = ["getrandom/wasm_js"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "generate_readme_data"
required-features = ["metrics"]

[[bench]]
name = "throughput"
harness = false
test = false

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[profile.bench]
codegen-units = 1
lto = "thin"
